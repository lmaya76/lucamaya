<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redrawing the Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday portfolio with an atlas's authority: calm, precise, nonpartisan
   IDEA a printed atlas of the United States: one plate per state, one key per method
   PICTURE a tile map of all 50 states on the home page; district maps on every state plate
   COLOUR white paper, slate ink; methods in teal, ochre and violet (never party red or blue)
   TYPE Barlow Condensed (road-map lettering) + Barlow
   LAYOUT title across the top, map full width beneath; plates stack below 600px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1820);--ink:light-dark(#14212c,#e6ecf1);--mute:light-dark(#5b6873,#9aa8b4);--rule:light-dark(#d9dee2,#2a3a47);--panel:light-dark(#f3f5f6,#16222c);--geo:#0f8a8f;--coi:#c98900;--par:#6d4fc4;--cur:light-dark(#62707c,#8e9ca8);--land:light-dark(#e9edf0,#1d2b36)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(38px,6vw,64px)}
h2{font-size:clamp(28px,3.4vw,38px)}
h3{font-size:22px}
p{margin:0 0 12px;max-width:68ch}
.band{padding-block:clamp(28px,4vw,56px);padding-inline:max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.alt{background:var(--panel)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px max(5vw,16px)}
.brand{font:700 22px "Barlow Condensed",sans-serif;text-decoration:none;margin-right:auto}
.brand span{color:var(--mute);font-weight:600}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{text-decoration:none;font-weight:500;padding:10px 10px;border-radius:6px;min-height:44px;display:inline-flex;align-items:center}
nav a:hover,nav a[aria-current]{background:var(--panel)}
nav i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
a:focus-visible,select:focus-visible{outline:3px solid var(--geo);outline-offset:2px}
.lede{font-size:18px;color:var(--mute);margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;margin-top:28px;max-width:820px}
.tile{aspect-ratio:1;border-radius:6px;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--geo) var(--k),var(--land));color:var(--ink);transition:transform .15s}
.tile b{font:700 clamp(12px,1.7vw,20px) "Barlow Condensed",sans-serif}
.tile small{font-size:13px;color:var(--ink);opacity:.8}
.tile.one{background:var(--land);border:1px dashed var(--rule)}
.tile:hover{transform:translateY(-2px);outline:2px solid var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;color:var(--mute);font-size:14px}
.key span{display:inline-flex;align-items:center;gap:8px}
.ramp{width:90px;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--land),var(--geo))}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px}
.card{border-top:6px solid var(--c);background:var(--bg);padding:18px;border-radius:0 0 8px 8px;display:flex;flex-direction:column;gap:10px}
.alt .card{background:var(--bg)}
.card a.more{font-weight:600;margin-top:auto;text-decoration:none;color:var(--c);min-height:44px;display:flex;align-items:center}
.card .pic{background:var(--panel);border-radius:6px;padding:8px}
.card .pic svg{display:block;width:100%;height:auto}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:start}
.steps{margin:0;padding-left:20px}.steps li{margin-bottom:8px}
.plate{background:var(--panel);border-radius:8px;padding:clamp(10px,2vw,20px)}
.slot{display:block}.slot img{display:block;width:100%;height:auto}
.plate svg,.plate img{display:block;width:100%;height:auto;max-width:100%}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--c)}
.tag::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--c)}
.crumbs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;color:var(--mute);font-size:15px}
select{font:16px Barlow,sans-serif;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);min-height:44px}
dl{display:grid;grid-template-columns:auto auto;gap:4px 12px;margin:0;font-size:15px}
dt{color:var(--mute)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--mute)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}
.pager a{font-weight:600;text-decoration:none;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;min-height:44px;display:inline-flex;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
.mini{text-decoration:none;background:var(--panel);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mini:hover{outline:2px solid var(--c)}
.mini svg{width:100%;height:auto;display:block}
.mini b{font:700 18px "Barlow Condensed",sans-serif}
.mini small{color:var(--mute);font-size:13px}
.list{columns:4 180px;margin-top:22px;padding:0;list-style:none}
.list li{break-inside:avoid}.list a{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid var(--rule);text-decoration:none}
.list span{color:var(--mute);font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--rule);color:var(--mute);font-size:14px}
.rate{display:grid;gap:6px;font-size:14px}
.rrow{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 2.5em;gap:8px;align-items:center}
.rrow i{height:8px;background:var(--land);border-radius:4px;overflow:hidden}
.rrow b{display:block;height:100%;background:var(--c,var(--cur))}
.rrow em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){header{position:static}.tiles{gap:3px}.tile small{display:none}.tile{border-radius:4px}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#home">Luca Maya <span>Redrawing the Map</span></a>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<footer class="band"><div class="wrap">
  <p>Redrawing the Map is an independent portfolio of alternative congressional maps by Luca Maya. Population counts follow the 2020 Census apportionment of 435 House seats.</p>
  <p>© 2026 Luca Maya</p>
</div></footer>
<script src="content.js"></script>
<script>
{
const CONTENT = window.CONTENT || {}; /* map content lives in content.js */
const RATINGS = [["proportionality","Proportionality"],["competitiveness","Competitiveness"],["minority","Minority representation"],["compactness","Compactness"],["splitting","County splitting"]];
const ratingsHTML=r=>{const rows=RATINGS.filter(([k])=>r&&r[k]!=null&&r[k]!=="");if(!rows.length)return "";return `<div class="rate"><p class="note" style="margin:0 0 4px">Dave's Redistricting ratings (0 to 100)</p>${rows.map(([k,l])=>{const v=Math.max(0,Math.min(100,Number(r[k])||0));return `<div class="rrow"><span>${l}</span><i><b style="width:${v}%"></b></i><em>${esc(r[k])}</em></div>`}).join("")}</div>`};

const METHODS = [
  {id:"geographic",name:"Geographic uniformity",color:"var(--geo)",hue:184,
   lede:"Districts drawn for shape and simplicity: equal population, compact outlines, and as few county and city splits as possible.",
   pri:["Compactness: districts close to round or square, not stretched or tentacled","Follow county and municipal lines wherever population allows","Ignore partisan and demographic data while drawing"],
   trade:"Simple, easy-to-explain lines, but they can split communities that share interests across a county border and can produce lopsided results where voters cluster."},
  {id:"communities",name:"Communities of interest",color:"var(--coi)",hue:40,
   lede:"Districts drawn around people who share economic, cultural, or geographic ties, so each community speaks with one voice.",
   pri:["Keep metro areas, regions, and economic corridors whole","Respect natural boundaries such as rivers and mountain ranges","Group places that share schools, industries, and media markets"],
   trade:"Reflects how people actually live, but defining a community involves judgment, and districts can take less regular shapes."},
  {id:"partisan",name:"Partisan uniformity",color:"var(--par)",hue:258,
   lede:"Districts drawn so the map as a whole reflects how the state votes, without building in an advantage for either party.",
   pri:["Seat outcomes track the statewide vote across a range of elections","Measure fairness with standard tests such as efficiency gap and mean-median difference","Keep districts contiguous and population-equal"],
   trade:"Directly targets fair outcomes, but requires using election data while drawing and can mean less compact lines."}
];

/* code, name, seats (2020 apportionment), tile column, tile row */
const STATES = [["AK","Alaska",1,0,0],["ME","Maine",2,10,0],["WI","Wisconsin",8,5,1],["VT","Vermont",1,9,1],["NH","New Hampshire",2,10,1],
["WA","Washington",10,0,2],["ID","Idaho",2,1,2],["MT","Montana",2,2,2],["ND","North Dakota",1,3,2],["MN","Minnesota",8,4,2],["IL","Illinois",17,5,2],["MI","Michigan",13,6,2],["NY","New York",26,8,2],["MA","Massachusetts",9,9,2],
["OR","Oregon",6,0,3],["NV","Nevada",4,1,3],["WY","Wyoming",1,2,3],["SD","South Dakota",1,3,3],["IA","Iowa",4,4,3],["IN","Indiana",9,5,3],["OH","Ohio",15,6,3],["PA","Pennsylvania",17,7,3],["NJ","New Jersey",12,8,3],["CT","Connecticut",5,9,3],["RI","Rhode Island",2,10,3],
["CA","California",52,0,4],["UT","Utah",4,1,4],["CO","Colorado",8,2,4],["NE","Nebraska",3,3,4],["MO","Missouri",8,4,4],["KY","Kentucky",6,5,4],["WV","West Virginia",2,6,4],["VA","Virginia",11,7,4],["MD","Maryland",8,8,4],["DE","Delaware",1,9,4],
["AZ","Arizona",9,1,5],["NM","New Mexico",3,2,5],["KS","Kansas",4,3,5],["AR","Arkansas",4,4,5],["TN","Tennessee",9,5,5],["NC","North Carolina",14,6,5],["SC","South Carolina",7,7,5],
["OK","Oklahoma",5,3,6],["LA","Louisiana",6,4,6],["MS","Mississippi",4,5,6],["AL","Alabama",7,6,6],["GA","Georgia",14,7,6],
["HI","Hawaii",2,0,7],["TX","Texas",38,3,7],["FL","Florida",28,8,7]].map(([code,name,seats,c,r])=>({code,name,seats,c,r,slug:name.toLowerCase().replace(/ /g,"-")}));

const ALPHA = [...STATES].sort((a,b)=>a.name.localeCompare(b.name));
const MULTI = ALPHA.filter(s=>s.seats>1);
const esc = v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = document.getElementById("app");

/* ---------- placeholder district map generator ---------- */
const hashStr = t=>{let h=7;for(const ch of t)h=(h*31+ch.charCodeAt(0))%2147483647;return h};
const rng = seed=>{let s=seed%2147483646+1;return()=>(s=s*16807%2147483647)/2147483647};
function districtSVG(st, variant, W, H){
  const r = rng(hashStr(st.code));
  const k=[r()*6,r()*6,r()*6], ax=.9+r()*.25, ay=.9+r()*.25;
  const inside=(x,y)=>{const dx=(x+.5-W/2)/(W/2)/ax*1.05,dy=(y+.5-H/2)/(H/2)/ay*1.05,a=Math.atan2(dy,dx);
    const rad=.86+.07*Math.sin(3*a+k[0])+.05*Math.sin(5*a+k[1])+.04*Math.sin(2*a+k[2]);return dx*dx+dy*dy<rad*rad};
  const g=new Array(W*H).fill(-2), cells=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(inside(x,y)){g[y*W+x]=-1;cells.push(y*W+x)}
  const r2 = rng(hashStr(st.code+variant));
  const n = Math.min(st.seats, cells.length);
  const fr=[];
  for(let d=0;d<n;d++){let c;do{c=cells[Math.floor(r2()*cells.length)]}while(g[c]!==-1);g[c]=d;fr.push([c])}
  const nb=c=>{const x=c%W,y=(c-x)/W,o=[];if(x>0)o.push([c-1,1]);if(x<W-1)o.push([c+1,1]);if(y>0)o.push([c-W,0]);if(y<H-1)o.push([c+W,0]);return o};
  const push=(d,c)=>{for(const [m,horiz] of nb(c)){if(g[m]!==-1)continue;if(variant==="partisan"&&!horiz&&r2()>.3)continue;fr[d].push(m)}};
  fr.forEach((f,d)=>push(d,f[0]));
  let live=true,guard=0;
  while(live&&guard++<200000){live=false;
    const order=variant==="current"?[Math.floor(r2()*n)]:[...Array(n).keys()];
    for(const d of order){const f=fr[d];
      while(f.length){const i=variant==="geographic"||variant==="partisan"?0:Math.floor(r2()*f.length);const c=f.splice(i,1)[0];
        if(g[c]===-1){g[c]=d;push(d,c);break}}
      if(f.length)live=true}
    if(variant==="current"&&!live)live=fr.some(f=>f.length)}
  for(let pass=0;pass<40;pass++){let left=0;for(const c of cells)if(g[c]===-1){const m=nb(c).find(([q])=>g[q]>=0);if(m)g[c]=g[m[0]];else left++}if(!left)break}
  const m=METHODS.find(x=>x.id===variant);
  const fill=d=>{const t=(d*0.618034)%1;return m?`hsl(${m.hue} ${45+t*25}% ${42+t*36}%)`:`hsl(210 ${6+t*8}% ${48+t*36}%)`};
  const paths=Array.from({length:n},()=>"");
  for(const c of cells){const d=g[c];if(d<0)continue;const x=c%W,y=(c-x)/W;paths[d]+=`M${x} ${y}h1v1h-1z`}
  let inner="",outer="";
  for(const c of cells){const x=c%W,y=(c-x)/W,v=g[c];
    const R=x<W-1?g[c+1]:-2,B=y<H-1?g[c+W]:-2,L=x>0?g[c-1]:-2,T=y>0?g[c-W]:-2;
    if(R===-2)outer+=`M${x+1} ${y}v1`;else if(R!==v)inner+=`M${x+1} ${y}v1`;
    if(B===-2)outer+=`M${x} ${y+1}h1`;else if(B!==v)inner+=`M${x} ${y+1}h1`;
    if(L===-2)outer+=`M${x} ${y}v1`;if(T===-2)outer+=`M${x} ${y}h1`}
  return `<svg viewBox="-.5 -.5 ${W+1} ${H+1}" role="img" aria-label="${esc(st.name)} ${esc(m?m.name:"current")} placeholder map">${paths.map((p,d)=>`<path d="${p}" fill="${fill(d)}"/>`).join("")}<path d="${inner}" stroke="var(--bg)" stroke-width=".18" fill="none" stroke-linecap="square"/><path d="${outer}" stroke="var(--ink)" stroke-width=".22" fill="none" stroke-linecap="square"/></svg>`;
}
const cache={};
/* A map image at maps/<state code>-<method>.png (e.g. maps/tx-geographic.png) shows automatically.
   Until it exists, a generated placeholder is drawn. */
const imgPath=(st,variant)=>((CONTENT[st.code]||{})[variant]||{}).image||`maps/${st.code.toLowerCase()}-${variant}.png`;
const mapFor=(st,variant,big)=>{const key=st.code+variant+big;
  return `<span class="slot" data-src="${esc(imgPath(st,variant))}" data-alt="${esc(st.name)} ${esc(variant)} map">${cache[key]??=(big?districtSVG(st,variant,30,19):districtSVG(st,variant,20,13))}</span>`};
const found={};
const loadSlots=()=>{for(const el of document.querySelectorAll(".slot[data-src]")){const src=el.dataset.src;
  const put=()=>{const im=document.createElement("img");im.src=src;im.alt=el.dataset.alt;el.replaceChildren(im);el.removeAttribute("data-src")};
  if(found[src]===true){put();continue}if(found[src]===false)continue;
  const t=new Image();t.onload=()=>{found[src]=true;put()};t.onerror=()=>{found[src]=false};t.src=src}};

/* ---------- shared pieces ---------- */
function nav(route){
  document.getElementById("nav").innerHTML=[["home","Home"],["states","States"],...METHODS.map(m=>[m.id,m.name.split(" ")[0]==="Communities"?"Communities":m.name.split(" ")[0],m.color]),["about","About"]]
    .map(([h,t,c])=>`<a href="#${h}"${route===h?' aria-current="page"':""}>${c?`<i style="background:${c}"></i>`:""}${t}</a>`).join("");
}
const tileMap=()=>`<div class="tiles" role="list">${STATES.map(s=>`<a role="listitem" class="tile${s.seats===1?" one":""}" style="grid-column:${s.c+1};grid-row:${s.r+1};--k:${s.seats===1?0:Math.round(12+Math.log(s.seats)/Math.log(52)*78)}%" href="#${s.slug}" title="${s.name}: ${s.seats} ${s.seats===1?"seat":"seats"}"><b>${s.code}</b><small>${s.seats}</small></a>`).join("")}</div>
<div class="key"><span><span class="ramp"></span>More districts</span><span>Dashed: one at-large seat, no lines to draw</span><span>Select any state to open its maps</span></div>`;
const methodCards=()=>`<div class="cols">${METHODS.map(m=>`<article class="card" style="--c:${m.color}"><h3>${m.name}</h3><div class="pic">${mapFor(STATES.find(s=>s.code==="NC"),m.id,false)}</div><p>${m.lede}</p><a class="more" href="#${m.id}">See every state drawn this way →</a></article>`).join("")}</div>`;
const jump=sel=>`<select id="jump" aria-label="Jump to a state"><option value="">Jump to a state…</option>${ALPHA.map(s=>`<option value="${s.slug}"${s.slug===sel?" selected":""}>${s.name}</option>`).join("")}</select>`;

/* ---------- pages ---------- */
const pages={
home:()=>`<section class="band"><div class="wrap">
  <h1>Redrawing the Map</h1>
  <p class="lede">Every state's congressional districts, redrawn three ways. Compare the current map with alternatives built for geographic simplicity, for communities of interest, and for partisan balance, and see what each choice changes.</p>
  ${tileMap()}
  <p class="note" style="margin-top:12px">States without a finished map show a generated placeholder until Luca adds his own.</p>
</div></section>
<section class="band alt"><div class="wrap">
  <h2>Three ways to draw fair districts</h2>
  <p class="lede">Every map has to balance competing goals. Each alternative here commits to one principle and follows it consistently across all 44 states with more than one district.</p>
  ${methodCards()}
</div></section>
<section class="band"><div class="wrap two">
  <div><h2>How to read each state</h2>
  <ol class="steps" style="margin-top:16px"><li>Start with the current map, the districts in use today.</li><li>Compare the three alternatives side by side, each drawn under one method.</li><li>Read the narrative for each map: what it prioritizes, what it gives up, and how it changes representation.</li><li>Switch to a method page to see the same approach applied to every state.</li></ol></div>
  <div class="plate">${mapFor(STATES.find(s=>s.code==="PA"),"current",true)}<p class="note" style="margin:8px 0 0">Example plate: Pennsylvania, current map (placeholder)</p></div>
</div></section>`,

states:()=>`<section class="band"><div class="wrap">
  <h1>All 50 states</h1>
  <p class="lede">44 states draw congressional districts. Six elect a single at-large representative and have no lines to draw.</p>
  ${tileMap()}
  <ul class="list">${ALPHA.map(s=>`<li><a href="#${s.slug}">${s.name}<span>${s.seats}</span></a></li>`).join("")}</ul>
</div></section>`,

about:()=>`<section class="band"><div class="wrap two">
  <div><h1>About this project</h1>
  <p class="lede">Luca Maya is a high school student who spends his free time drawing alternative congressional maps.</p>
  <p>This site collects that work in one place: for every state, the map in use today and three alternatives, each built on a single principle and explained in plain language.</p>
  <p>The goal is not to argue for one party. It is to show that how lines are drawn is a choice, and that different, defensible choices lead to very different maps.</p>
  <h3 style="margin-top:22px">Method and data</h3>
  <p>District populations follow the 2020 Census. Maps are drawn in Dave's Redistricting App, and each alternative keeps districts contiguous and as close to equal population as practical. Ratings shown on state pages come from the app's built-in analytics. State narratives describe the specific choices made.</p></div>
  <div class="plate">${mapFor(STATES.find(s=>s.code==="OH"),"communities",true)}</div>
</div></section>`
};

function statePage(st){
  const i=ALPHA.indexOf(st),prev=ALPHA[(i+49)%50],next=ALPHA[(i+1)%50];
  const c=CONTENT[st.code]||{};
  const head=`<div class="crumbs"><a href="#states">All states</a>${jump(st.slug)}</div><h1>${esc(st.name)}</h1>`;
  const pager=`<div class="pager"><a href="#${prev.slug}">← ${prev.name}</a><a href="#${next.slug}">${next.name} →</a></div>`;
  if(st.seats===1)return `<section class="band"><div class="wrap">${head}
    <p class="lede">${esc(st.name)} elects one representative at large, so there are no congressional districts to draw. Its seat is shown here to complete the map of all 50 states.</p>${pager}</div></section>`;
  const cur=c.current||{};
  return `<section class="band"><div class="wrap">${head}
  <p class="lede">${st.seats} congressional districts. The current map, followed by three alternatives.</p>
  <div class="two" style="margin-top:22px">
    <div class="plate">${mapFor(st,"current",true)}</div>
    <div><span class="tag" style="--c:var(--cur)">Current map</span>
      <h2 style="margin:8px 0 12px">The districts in use today</h2>
      <p>${cur.narrative?esc(cur.narrative):`Luca's notes on ${esc(st.name)}'s current map: how it was drawn, who drew it, and what stands out about its lines.`}</p>
      ${ratingsHTML(cur.ratings)}
      ${cur.link?`<p><a href="${esc(cur.link)}" target="_blank" rel="noopener">Open in Dave's Redistricting App</a></p>`:""}
</div>
  </div></div></section>
  <section class="band alt"><div class="wrap">
  <h2>Three alternatives</h2>
  <div class="cols">${METHODS.map(m=>{const e=c[m.id]||{};const stats=Object.entries(e.stats||{});
    return `<article class="card" style="--c:${m.color}"><a class="tag" href="#${m.id}" style="text-decoration:none">${m.name}</a>
      <div class="pic">${mapFor(st,m.id,true)}</div>
      <p>${e.narrative?esc(e.narrative):`Luca's narrative for ${esc(st.name)} under ${m.name.toLowerCase()}: what this map prioritizes, what it gives up, and how it compares with the current districts.`}</p>
      ${ratingsHTML(e.ratings)}
      ${stats.length?`<dl>${stats.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}
      ${e.link?`<a class="more" href="${esc(e.link)}" target="_blank" rel="noopener">Open in Dave's Redistricting App →</a>`:""}</article>`}).join("")}</div>
  ${pager}</div></section>`;
}

function methodPage(m){
  return `<section class="band" style="border-top:8px solid ${m.color}"><div class="wrap two">
  <div><span class="tag" style="--c:${m.color}">Method</span><h1 style="margin-top:8px">${m.name}</h1><p class="lede">${m.lede}</p></div>
  <div><h3>What it prioritizes</h3><ul class="steps" style="margin-top:10px">${m.pri.map(p=>`<li>${p}</li>`).join("")}</ul><h3 style="margin-top:16px">The trade-off</h3><p style="margin-top:8px">${m.trade}</p></div>
  </div></section>
  <section class="band alt"><div class="wrap">
  <h2>Every state, drawn for ${m.name.toLowerCase()}</h2>
  <p class="lede">${MULTI.length} states with more than one district. Select a state for the full comparison.</p>
  <div class="grid">${MULTI.map(s=>`<a class="mini" style="--c:${m.color}" href="#${s.slug}">${mapFor(s,m.id,false)}<b>${s.name}</b><small>${s.seats} districts</small></a>`).join("")}</div>
  </div></section>`;
}

function render(){
  const h=location.hash.slice(1)||"home";
  const st=STATES.find(s=>s.slug===h), m=METHODS.find(x=>x.id===h);
  const route=pages[h]?h:st?"states":m?h:"home";
  app.innerHTML=st?statePage(st):m?methodPage(m):(pages[h]||pages.home)();
  document.title=st?`${st.name} | Redrawing the Map`:m?`${m.name} | Redrawing the Map`:"Redrawing the Map";
  nav(route);
  loadSlots();
  const j=document.getElementById("jump");
  if(j)j.addEventListener("change",()=>{if(j.value)location.hash=j.value});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
}
</script>
</body>
</html>
